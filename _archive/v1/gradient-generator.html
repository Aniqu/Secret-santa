<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Gradient Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            overflow: visible;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1em;
        }

        .gradient-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .gradient-controls select,
        .gradient-controls input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .gradient-controls select:focus,
        .gradient-controls input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .color-stops {
            grid-column: 1 / -1;
        }

        .color-stop {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .color-input {
            width: 60px;
            height: 40px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .position-input {
            width: 80px;
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .gradient-preview {
            margin-bottom: 30px;
        }

        .preview-box {
            width: 100%;
            height: 300px;
            border-radius: 15px;
            border: 3px solid #667eea;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
            margin-top: 10px;
        }

        .css-output {
            margin-bottom: 20px;
        }

        .css-output textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            background: #f8f9fa;
            resize: vertical;
            margin-bottom: 15px;
        }

        .css-output textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px;
            }

            .header h1 {
                font-size: 2em;
            }

            .gradient-controls {
                grid-template-columns: 1fr;
            }

            .color-stop {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 CSS Gradient Generator</h1>
            <p>Create beautiful CSS gradients with live preview and export</p>
        </div>

        <div class="gradient-controls">
            <div class="input-group">
                <label for="gradientType">Gradient Type</label>
                <select id="gradientType" onchange="updateGradient()">
                    <option value="linear">Linear Gradient</option>
                    <option value="radial">Radial Gradient</option>
                </select>
            </div>

            <div class="input-group" id="directionGroup">
                <label for="gradientDirection">Direction</label>
                <select id="gradientDirection" onchange="updateGradient()">
                    <option value="to right">To Right</option>
                    <option value="to bottom">To Bottom</option>
                    <option value="to left">To Left</option>
                    <option value="to top">To Top</option>
                    <option value="45deg">45 Degrees</option>
                    <option value="135deg">135 Degrees</option>
                </select>
            </div>

            <div class="color-stops">
                <label>Color Stops</label>
                <div id="colorStopsContainer">
                    <div class="color-stop">
                        <input type="color" value="#ff6b6b" onchange="updateGradient()" class="color-input">
                        <input type="number" value="0" min="0" max="100" onchange="updateGradient()" class="position-input">%
                    </div>
                    <div class="color-stop">
                        <input type="color" value="#4ecdc4" onchange="updateGradient()" class="color-input">
                        <input type="number" value="100" min="0" max="100" onchange="updateGradient()" class="position-input">%
                    </div>
                </div>
                <button class="btn" onclick="addColorStop()" style="margin-top: 10px; padding: 10px 20px; font-size: 0.9em;">Add Color Stop</button>
            </div>
        </div>

        <div class="gradient-preview">
            <h3 style="margin-bottom: 10px;">Live Preview</h3>
            <div id="gradientPreview" class="preview-box"></div>
        </div>

        <div class="css-output">
            <h3>CSS Code</h3>
            <textarea id="cssOutput" readonly></textarea>
            <button class="btn" onclick="exportCSS()">Export as CSS File</button>
            <button class="btn" onclick="copyCSS()" style="background: linear-gradient(135deg, #28a745 0%, #20c997 100%);">Copy CSS</button>
        </div>
    </div>

    <script>
        function updateGradient() {
            const type = document.getElementById('gradientType').value;
            const direction = document.getElementById('gradientDirection').value;
            const colorStops = document.querySelectorAll('.color-stop');

            let gradientValue = '';
            let cssCode = '';

            if (type === 'linear') {
                const stops = Array.from(colorStops).map(stop => {
                    const color = stop.querySelector('.color-input').value;
                    const position = stop.querySelector('.position-input').value;
                    return `${color} ${position}%`;
                }).join(', ');

                gradientValue = `linear-gradient(${direction}, ${stops})`;
                cssCode = `background: ${gradientValue};`;
            } else if (type === 'radial') {
                const stops = Array.from(colorStops).map(stop => {
                    const color = stop.querySelector('.color-input').value;
                    const position = stop.querySelector('.position-input').value;
                    return `${color} ${position}%`;
                }).join(', ');

                gradientValue = `radial-gradient(circle, ${stops})`;
                cssCode = `background: ${gradientValue};`;
            }

            // Update preview
            document.getElementById('gradientPreview').style.background = gradientValue;

            // Update CSS output
            document.getElementById('cssOutput').value = cssCode;
        }

        function addColorStop() {
            const container = document.getElementById('colorStopsContainer');
            const newStop = document.createElement('div');
            newStop.className = 'color-stop';
            newStop.innerHTML = `
                <input type="color" value="#ffffff" onchange="updateGradient()" class="color-input">
                <input type="number" value="50" min="0" max="100" onchange="updateGradient()" class="position-input">%
                <button onclick="removeColorStop(this)" style="margin-left: 10px; background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.8em;">Remove</button>
            `;
            container.appendChild(newStop);
            updateGradient();
        }

        function removeColorStop(button) {
            button.parentElement.remove();
            updateGradient();
        }

        function exportCSS() {
            const css = document.getElementById('cssOutput').value;
            const fullCSS = `.my-gradient {\n    ${css}\n}\n\n/* Or use directly: */\n${css}`;
            const blob = new Blob([fullCSS], { type: 'text/css' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'gradient-styles.css';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function copyCSS() {
            const css = document.getElementById('cssOutput').value;
            navigator.clipboard.writeText(css).then(() => {
                alert('CSS copied to clipboard!');
            });
        }

        // Initialize
        updateGradient();
    </script>
</body>
</html>
